<div data-example="actions" data-title="Form actions" data-state="default" data-reason="The group has one primary action and it comes last: at the far end of the row at the regular width, and at the bottom of the stack on a phone, nearest the thumb. Source order and visual order are the same.">

    <button type="submit" class="ds-button ds-button--primary">Start task</button>
  </div>
</div>
