<div data-example="default" data-title="A value and its Copy button" data-state="default" data-reason="The value is real text in a read-only input, so it can be selected by hand as well as copied with the button. The empty status line is already in the page, ready for the app to write the result into.">
  <div class="gw-field">
    <label class="gw-field__label" for="copy-field-default-branch">Branch</label>
    <div class="gw-copy-field">
      <input class="gw-copy-field__value" id="copy-field-default-branch" type="text" readonly value="fix/login-timeout">
      <button type="button" class="gw-button" aria-label="Copy branch name">
        <svg class="gw-button__icon" aria-hidden="true"><use href="icons.svg#gw-icon-copy"></use></svg>
        Copy
      </button>
      <p class="gw-copy-field__status" role="status"></p>
    </div>
  </div>
</div>

<div data-example="error" data-title="When the copy fails" data-state="error">

    <label class="gw-field__label" for="copy-field-error-branch">Branch</label>

      <input class="gw-copy-field__value" id="copy-field-error-branch" type="text" readonly value="fix/login-timeout">
      <button type="button" class="gw-button" aria-label="Copy branch name">

        Copy
      </button>
      <p class="gw-copy-field__status" role="status">The browser blocked the copy. Select the branch name and copy it by hand.</p>

  </div>
</div>

<div data-example="disabled-value" data-title="The value in a disabled input" data-dont="review" data-reason="A disabled input cannot take focus, so the keyboard cannot reach the value to select it, and it reads as unavailable. Use the readonly attribute, which keeps the value focusable and selectable.">
