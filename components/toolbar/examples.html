<div data-example="default" data-title="Groups, toggles and a More menu below 768px" data-state="default" data-reason="The toolbar has a label, its controls are grouped by what they act on, and every icon button has a name. The two toggles say whether they are on through aria-pressed, drawn as a fill and a bar. Below 768px the least used group leaves the row and the More menu offers the same actions.">
  <div class="ds-toolbar" role="toolbar" aria-label="Diff of task 41">
    <div class="ds-toolbar__group" role="group" aria-label="Move between changes">
      <button type="button" class="ds-button ds-button--quiet ds-icon-button" aria-label="Go to the previous change"><svg class="ds-button__icon" aria-hidden="true"><use href="icons.svg#ds-icon-chevron-up"></use></svg></button>
      <button type="button" class="ds-button ds-button--quiet ds-icon-button" aria-label="Go to the next change"><svg class="ds-button__icon" aria-hidden="true"><use href="icons.svg#ds-icon-chevron-down"></use></svg></button>
      <span class="ds-toolbar__text">Change 3 of 12</span>
    </div>
    <div class="ds-toolbar__separator" role="separator" aria-orientation="vertical"></div>
    <div class="ds-toolbar__group" role="group" aria-label="Panels">
      <button type="button" class="ds-button ds-button--quiet ds-icon-button" aria-label="Show the file tree" aria-pressed="true"><svg class="ds-button__icon" aria-hidden="true"><use href="icons.svg#ds-icon-folder"></use></svg></button>
      <button type="button" class="ds-button ds-button--quiet ds-icon-button" aria-label="Show the terminal" aria-pressed="false"><svg class="ds-button__icon" aria-hidden="true"><use href="icons.svg#ds-icon-terminal"></use></svg></button>
    </div>
    <div class="ds-toolbar__overflow">
      <div class="ds-toolbar__separator" role="separator" aria-orientation="vertical"></div>
      <div class="ds-toolbar__group" role="group" aria-label="Share the diff">
        <button type="button" class="ds-button ds-button--quiet ds-icon-button" aria-label="Copy the diff"><svg class="ds-button__icon" aria-hidden="true"><use href="icons.svg#ds-icon-copy"></use></svg></button>
        <button type="button" class="ds-button ds-button--quiet ds-icon-button" aria-label="Open the diff on GitHub"><svg class="ds-button__icon" aria-hidden="true"><use href="icons.svg#ds-icon-external-link"></use></svg></button>
      </div>
    </div>
    <div class="ds-toolbar__more">
      <button type="button" class="ds-button ds-button--quiet ds-icon-button" popovertarget="toolbar-default-more" aria-haspopup="menu" aria-label="More actions for the diff">
        <svg class="ds-button__icon" aria-hidden="true"><use href="icons.svg#ds-icon-ellipsis"></use></svg>
      </button>
      <div class="ds-menu" id="toolbar-default-more" popover role="menu" aria-label="More actions for the diff">
        <button type="button" class="ds-menu__item" role="menuitem">
          <svg class="ds-menu__icon" aria-hidden="true"><use href="icons.svg#ds-icon-copy"></use></svg>
          Copy the diff
        </button>
        <button type="button" class="ds-menu__item" role="menuitem">
          <svg class="ds-menu__icon" aria-hidden="true"><use href="icons.svg#ds-icon-external-link"></use></svg>
          Open the diff on GitHub
        </button>
      </div>
    </div>
  </div>
</div>
