<div data-example="default" data-title="Default, beside what is loading" data-state="loading" data-reason="The text says what is in progress, so it reads the same to a screen reader, and to someone who has turned motion off and sees a still mark.">
  <p class="ds-spinner" role="status">Loading runs</p>
</div>

<div data-example="large" data-title="Large, for a whole view">
  <p class="ds-spinner ds-spinner--large" role="status">Cloning acme/api</p>
</div>

<div data-example="with-cancel" data-title="With a way to stop" class="ds-split">
  <p class="ds-spinner" role="status">Running 214 tests</p>
  <button type="button" class="ds-button ds-button--quiet ds-button--small">Stop tests</button>
</div>

<div data-example="no-label" data-title="A spinner with no text" data-dont="review" data-reason="With motion turned off this is a still mark that says nothing, and a screen reader has nothing to announce. Write what is in progress inside the spinner.">
  <p class="ds-spinner" role="status"></p>
</div>
