<div data-example="default" data-title="Initials, with the name beside the mark" data-state="default" data-reason="The name is written out next to the mark, so nobody has to work out who MO is, and the mark is hidden from a screen reader so the name is read once. The mark is a plain square on a flat surface.">
  <span class="gw-avatar">
    <span class="gw-avatar__mark" aria-hidden="true">MO</span>
    <span class="gw-avatar__name">Maya Okafor</span>
  </span>
</div>

<div data-example="agent" data-title="An icon, for an agent">
  <span class="gw-avatar">
    <span class="gw-avatar__mark" aria-hidden="true">
      <svg class="gw-avatar__icon"><use href="icons.svg#gw-icon-terminal"></use></svg>
    </span>
    <span class="gw-avatar__name">Claude Code, implementer</span>
  </span>
</div>

<div data-example="image" data-title="An image, with an empty alt because the name is beside it">
  <span class="gw-avatar">
    <img class="gw-avatar__mark" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23d8d3c8'/%3E%3Ccircle cx='16' cy='12' r='6' fill='%235c5850'/%3E%3Cpath d='M3 34a13 13 0 0 1 26 0z' fill='%235c5850'/%3E%3C/svg%3E" alt="" width="32" height="32">
    <span class="gw-avatar__name">Tomás Reyes</span>
  </span>
</div>

<div data-example="small" data-title="Small, for a dense row or a line of text">
  <div class="gw-stack gw-gap-sm">
    <span class="gw-avatar gw-avatar--small">
      <span class="gw-avatar__mark" aria-hidden="true">MO</span>
      <span class="gw-avatar__name">Maya Okafor</span>
    </span>
    <span class="gw-avatar gw-avatar--small">
      <span class="gw-avatar__mark" aria-hidden="true">
        <svg class="gw-avatar__icon"><use href="icons.svg#gw-icon-terminal"></use></svg>
      </span>
      <span class="gw-avatar__name">Claude Code, reviewer</span>
    </span>
    <span class="gw-avatar gw-avatar--small">
      <img class="gw-avatar__mark" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23d8d3c8'/%3E%3Ccircle cx='16' cy='12' r='6' fill='%235c5850'/%3E%3Cpath d='M3 34a13 13 0 0 1 26 0z' fill='%235c5850'/%3E%3C/svg%3E" alt="" width="24" height="24">
      <span class="gw-avatar__name">Tomás Reyes</span>
    </span>
  </div>
</div>

<div data-example="mark-only" data-title="A mark with no visible name, named for a screen reader">
  <div class="gw-cluster">
    <span class="gw-avatar">
      <span class="gw-avatar__mark" role="img" aria-label="Maya Okafor">MO</span>
    </span>
    <span class="gw-avatar">
      <img class="gw-avatar__mark" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23d8d3c8'/%3E%3Ccircle cx='16' cy='12' r='6' fill='%235c5850'/%3E%3Cpath d='M3 34a13 13 0 0 1 26 0z' fill='%235c5850'/%3E%3C/svg%3E" alt="Tomás Reyes" width="32" height="32">
    </span>
    <p>approved task 41</p>
  </div>
</div>

<div data-example="initials-only" data-title="Marks alone, with no names anywhere" data-dont="review" data-reason="Initials do not identify anyone to a new teammate, two people can share them, and with no name and no label a screen reader reads letters or nothing. Show the name beside the mark unless it is already written right next to it.">
  <div class="gw-cluster">
    <span class="gw-avatar"><span class="gw-avatar__mark">MO</span></span>
    <span class="gw-avatar"><span class="gw-avatar__mark">TR</span></span>
    <span class="gw-avatar"><span class="gw-avatar__mark">MO</span></span>
  </div>
</div>
