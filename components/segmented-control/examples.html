<div data-example="default" data-title="Two options" data-state="default" data-reason="The two views are named, exactly one is in use, and both stay visible. The chosen one is a raised, bordered segment with heavier text, so it can be told apart without colour.">
  <fieldset class="ds-segmented-control">
    <legend class="ds-segmented-control__legend">Diff layout</legend>
    <div class="ds-segmented-control__options">
      <label class="ds-segmented-control__option">
        <input class="ds-segmented-control__input" type="radio" name="segmented-control-default-layout" value="unified" checked>
        <span class="ds-segmented-control__label">Unified</span>
      </label>
      <label class="ds-segmented-control__option">
        <input class="ds-segmented-control__input" type="radio" name="segmented-control-default-layout" value="split">
        <span class="ds-segmented-control__label">Split</span>
      </label>
    </div>
  </fieldset>
</div>

<div data-example="selected" data-title="Three options, the middle one chosen" data-state="selected">
  <fieldset class="ds-segmented-control">
    <legend class="ds-segmented-control__legend">Transcript detail</legend>

      <label class="ds-segmented-control__option">

      </label>

        <input class="ds-segmented-control__input" type="radio" name="segmented-control-selected-detail" value="commands" checked>

</div>

<div data-example="five" data-title="Five options, with a visually hidden legend">
  <fieldset class="ds-segmented-control">
    <legend class="ds-segmented-control__legend ds-visually-hidden">Show runs with status</legend>
    <div class="ds-segmented-control__options">
      <label class="ds-segmented-control__option">
        <input class="ds-segmented-control__input" type="radio" name="segmented-control-five-status" value="all" checked>
        <span class="ds-segmented-control__label">All</span>
      </label>
      <label class="ds-segmented-control__option">
        <input class="ds-segmented-control__input" type="radio" name="segmented-control-five-status" value="queued">
        <span class="ds-segmented-control__label">Queued</span>
      </label>
      <label class="ds-segmented-control__option">
        <input class="ds-segmented-control__input" type="radio" name="segmented-control-five-status" value="running">
        <span class="ds-segmented-control__label">Running</span>
      </label>
      <label class="ds-segmented-control__option">
        <input class="ds-segmented-control__input" type="radio" name="segmented-control-five-status" value="failed">
        <span class="ds-segmented-control__label">Failed</span>
      </label>
      <label class="ds-segmented-control__option">
        <input class="ds-segmented-control__input" type="radio" name="segmented-control-five-status" value="done">
        <span class="ds-segmented-control__label">Done</span>
      </label>
    </div>
  </fieldset>
</div>

<div data-example="disabled" data-title="One option disabled, and a whole control disabled" data-state="disabled">
  <div class="ds-stack ds-gap-lg">
    <fieldset class="ds-segmented-control">
      <legend class="ds-segmented-control__legend">Run the task on</legend>
      <div class="ds-segmented-control__options">
        <label class="ds-segmented-control__option">
          <input class="ds-segmented-control__input" type="radio" name="segmented-control-disabled-runner" value="local" checked>
          <span class="ds-segmented-control__label">This machine</span>
        </label>
        <label class="ds-segmented-control__option">
          <input class="ds-segmented-control__input" type="radio" name="segmented-control-disabled-runner" value="container">
          <span class="ds-segmented-control__label">Container</span>
        </label>
        <label class="ds-segmented-control__option">
          <input class="ds-segmented-control__input" type="radio" name="segmented-control-disabled-runner" value="cloud" disabled>
          <span class="ds-segmented-control__label">Cloud runner</span>
        </label>
      </div>
    </fieldset>
    <fieldset class="ds-segmented-control" disabled>
      <legend class="ds-segmented-control__legend">Diff layout</legend>
      <div class="ds-segmented-control__options">
        <label class="ds-segmented-control__option">
          <input class="ds-segmented-control__input" type="radio" name="segmented-control-disabled-layout" value="unified" checked>
          <span class="ds-segmented-control__label">Unified</span>
        </label>
        <label class="ds-segmented-control__option">
          <input class="ds-segmented-control__input" type="radio" name="segmented-control-disabled-layout" value="split">
          <span class="ds-segmented-control__label">Split</span>
        </label>
      </div>
    </fieldset>
  </div>
</div>
