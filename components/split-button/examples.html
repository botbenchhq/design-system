<div data-example="default" data-title="A main action and its alternatives" data-state="default" data-reason="The main action is the one most readers want, so it takes one press and is the view's primary button. The menu button beside it is secondary, has its own name, and holds only other ways to do the same thing.">
  <div class="gw-split-button" role="group" aria-label="Start task">
    <button type="button" class="gw-button gw-button--primary gw-split-button__action">Start task</button>
    <button type="button" class="gw-button gw-split-button__toggle" popovertarget="split-button-default-menu" aria-haspopup="menu">
      <svg class="gw-button__icon" aria-hidden="true"><use href="icons.svg#gw-icon-chevron-down"></use></svg>
      <span class="gw-visually-hidden">More ways to start the task</span>
    </button>
    <div class="gw-menu" id="split-button-default-menu" popover role="menu" aria-label="More ways to start the task">
      <button type="button" class="gw-menu__item" role="menuitem">Start on a new branch</button>
      <button type="button" class="gw-menu__item" role="menuitem">Start in plan-only mode</button>
      <button type="button" class="gw-menu__item" role="menuitem">Start when run 4182 finishes</button>
    </div>
  </div>
</div>

<div data-example="open" data-title="Secondary, with its menu open" data-state="open" data-gallery-frame="short" data-gallery-open>
  <div class="gw-split-button" role="group" aria-label="Run again">
    <button type="button" class="gw-button gw-split-button__action">Run again</button>
    <button type="button" class="gw-button gw-split-button__toggle" popovertarget="split-button-open-menu" aria-haspopup="menu">
      <svg class="gw-button__icon" aria-hidden="true"><use href="icons.svg#gw-icon-chevron-down"></use></svg>
      <span class="gw-visually-hidden">More ways to run again</span>
    </button>
    <div class="gw-menu" id="split-button-open-menu" popover role="menu" aria-label="More ways to run again">
      <button type="button" class="gw-menu__item" role="menuitem">Run again from the failed step</button>
      <button type="button" class="gw-menu__item" role="menuitem">Run again with a clean cache</button>
      <button type="button" class="gw-menu__item" role="menuitem">Run again on main</button>
    </div>
  </div>
</div>
