<div data-example="named" data-title="Bordered and quiet, each with a name" data-state="default" data-reason="Each button says what it does to a screen reader and to voice control: one through aria-label, one through visually hidden text. The icon itself is hidden from both.">
  <div class="ds-cluster">
    <button type="button" class="ds-button ds-icon-button" aria-label="Copy branch name">
      <svg class="ds-button__icon" aria-hidden="true"><use href="icons.svg#ds-icon-copy"></use></svg>
    </button>
    <button type="button" class="ds-button ds-button--quiet ds-icon-button">
      <svg class="ds-button__icon" aria-hidden="true"><use href="icons.svg#ds-icon-ellipsis"></use></svg>
      <span class="ds-visually-hidden">More actions for run 2184</span>
    </button>
  </div>
</div>

<div data-example="in-a-row" data-title="Quiet, at the end of a row">
  <div class="ds-split">
    <code>fix/session-refresh</code>
    <div class="ds-cluster ds-gap-xs">
      <button type="button" class="ds-button ds-button--quiet ds-icon-button" aria-label="Copy branch name">
        <svg class="ds-button__icon" aria-hidden="true"><use href="icons.svg#ds-icon-copy"></use></svg>
      </button>
      <button type="button" class="ds-button ds-button--quiet ds-icon-button" aria-label="Open the branch on GitHub">
        <svg class="ds-button__icon" aria-hidden="true"><use href="icons.svg#ds-icon-external-link"></use></svg>
      </button>
    </div>
  </div>
</div>
