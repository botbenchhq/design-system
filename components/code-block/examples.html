<div data-example="line-numbers" data-title="A file excerpt with line numbers">
  <figure class="ds-code-block">
    <figcaption class="ds-code-block__caption">src/session/verify.mjs, lines 41 to 47</figcaption>
    <pre class="ds-code-block__body"><code class="ds-code-block__lines">
      <span class="ds-code-block__line"><span class="ds-code-block__number">41</span><span class="ds-code-block__text">export function verify(token, now = Date.now()) {</span></span>
      <span class="ds-code-block__line"><span class="ds-code-block__number">42</span><span class="ds-code-block__text">  const session = decode(token);</span></span>
      <span class="ds-code-block__line"><span class="ds-code-block__number">43</span><span class="ds-code-block__text">  if (now - session.issuedAt &gt; SESSION_TTL_SECONDS * 1000) {</span></span>
      <span class="ds-code-block__line"><span class="ds-code-block__number">44</span><span class="ds-code-block__text">    throw new SessionExpired(`The session for ${session.user} ended after ${SESSION_TTL_SECONDS} seconds.`);</span></span>
      <span class="ds-code-block__line"><span class="ds-code-block__number">45</span><span class="ds-code-block__text">  }</span></span>
      <span class="ds-code-block__line"><span class="ds-code-block__number">46</span><span class="ds-code-block__text">  return session;</span></span>
      <span class="ds-code-block__line"><span class="ds-code-block__number">47</span><span class="ds-code-block__text">}</span></span>
    </code></pre>
  </figure>
