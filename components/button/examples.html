<div data-example="variants" data-title="Variants" data-state="default" class="ds-cluster">
  <button type="button" class="ds-button ds-button--primary">Start task</button>
  <button type="button" class="ds-button">Save draft</button>
  <button type="button" class="ds-button ds-button--quiet">View log</button>
  <button type="button" class="ds-button ds-button--danger">Delete workspace</button>
</div>

<div data-example="sizes" data-title="Default and small" class="ds-cluster">
  <button type="button" class="ds-button">Open pull request</button>
  <button type="button" class="ds-button ds-button--small">Copy path</button>
  <button type="button" class="ds-button ds-button--quiet ds-button--small">Dismiss</button>
</div>

<div data-example="with-icon" data-title="With a leading icon" class="ds-cluster">
  <button type="button" class="ds-button ds-button--primary">
    <svg class="ds-button__icon" aria-hidden="true"><use href="icons.svg#ds-icon-plus"></use></svg>
    New task
  </button>
  <button type="button" class="ds-button">
    <svg class="ds-button__icon" aria-hidden="true"><use href="icons.svg#ds-icon-git-branch"></use></svg>
    Create branch
  </button>
  <button type="button" class="ds-button ds-button--quiet ds-button--small">
    <svg class="ds-button__icon" aria-hidden="true"><use href="icons.svg#ds-icon-copy"></use></svg>
    Copy
  </button>
</div>

<div data-example="hover" data-title="Hover" data-state="hover" class="ds-cluster">
  <button type="button" class="ds-button ds-button--primary">Start task</button>
  <button type="button" class="ds-button">Save draft</button>
  <button type="button" class="ds-button ds-button--quiet">View log</button>
  <button type="button" class="ds-button ds-button--danger">Delete workspace</button>
</div>

<div data-example="focus-visible" data-title="Keyboard focus" data-state="focus-visible" class="ds-cluster">
  <button type="button" class="ds-button ds-button--primary">Start task</button>
  <button type="button" class="ds-button">Save draft</button>
</div>

<div data-example="active" data-title="Pressed" data-state="active" class="ds-cluster">
  <button type="button" class="ds-button ds-button--primary">Start task</button>
  <button type="button" class="ds-button">Save draft</button>
  <button type="button" class="ds-button ds-button--quiet">View log</button>
  <button type="button" class="ds-button ds-button--danger">Delete workspace</button>
</div>

<div data-example="disabled" data-title="Disabled" data-state="disabled" class="ds-cluster">
  <button type="button" class="ds-button ds-button--primary" disabled>Start task</button>
  <button type="button" class="ds-button" disabled>Save draft</button>
  <button type="button" class="ds-button ds-button--quiet" disabled>View log</button>
  <button type="button" class="ds-button ds-button--danger" disabled>Delete workspace</button>
</div>

<div data-example="busy" data-title="Busy" data-state="busy" class="ds-cluster">
  <button type="button" class="ds-button ds-button--primary" aria-busy="true">Starting task</button>
  <button type="button" class="ds-button" aria-busy="true">Saving draft</button>
</div>

<div data-example="one-primary" data-title="One primary action" data-reason="The view has one main action, and the primary button marks it. Everything else is secondary or quiet." class="ds-cluster">
  <button type="button" class="ds-button ds-button--primary">Start task</button>
  <button type="button" class="ds-button">Save as template</button>
  <button type="button" class="ds-button ds-button--quiet">Cancel</button>
</div>

<div data-example="two-primaries" data-title="Two primary actions" data-dont="one-primary-action" data-reason="Two primary buttons compete, and the reader has to work out which one matters. Keep one and make the other secondary." class="ds-cluster">
  <button type="button" class="ds-button ds-button--primary">Start task</button>
  <button type="button" class="ds-button ds-button--primary">Save as template</button>
</div>
