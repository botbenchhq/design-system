<div data-example="default" data-title="Actions on a task" data-state="open" data-gallery-frame data-gallery-open data-reason="The button says what the menu acts on. Each item is a verb and its object, the item that deletes is last, below a divider, and its label names what is deleted.">
  <button type="button" class="gw-button" popovertarget="menu-default" aria-haspopup="menu">
    Task actions
    <svg class="gw-button__icon" aria-hidden="true"><use href="icons.svg#gw-icon-chevron-down"></use></svg>
  </button>
  <div class="gw-menu" id="menu-default" popover role="menu" aria-label="Task actions">
    <div class="gw-menu__section" role="group" aria-labelledby="menu-default-branch">
      <div class="gw-menu__label" id="menu-default-branch" role="presentation">Branch fix/login-timeout</div>
      <button type="button" class="gw-menu__item" role="menuitem">
        <svg class="gw-menu__icon" aria-hidden="true"><use href="icons.svg#gw-icon-copy"></use></svg>
        Copy branch name
      </button>
      <button type="button" class="gw-menu__item" role="menuitem">
        <svg class="gw-menu__icon" aria-hidden="true"><use href="icons.svg#gw-icon-git-branch"></use></svg>
        Rebase onto main
      </button>
      <button type="button" class="gw-menu__item" role="menuitem">
        <svg class="gw-menu__icon" aria-hidden="true"><use href="icons.svg#gw-icon-terminal"></use></svg>
        Open a terminal in the worktree
      </button>
    </div>
    <hr class="gw-menu__divider">
    <button type="button" class="gw-menu__item gw-menu__item--danger" role="menuitem">Delete task 41</button>
  </div>
</div>
