<div data-example="default" data-title="Checks on a branch" data-state="default" data-reason="The label says what is measured and the sentence gives the count with its total and unit, so the reader does not have to judge the bar by eye. The bar is a native progress element, sized by its value and max attributes with no inline style.">
  <div class="gw-progress">
    <label class="gw-progress__label" for="progress-default-bar">Checks on fix/login-timeout</label>
    <p class="gw-progress__value">7 of 12 checks passed</p>
    <progress class="gw-progress__bar" id="progress-default-bar" value="7" max="12" aria-valuetext="7 of 12 checks passed"></progress>
  </div>
</div>

<div data-example="indeterminate" data-title="Indeterminate: the length is not known yet" data-state="indeterminate">
  <div class="gw-progress">
    <label class="gw-progress__label" for="progress-indeterminate-bar">Cloning acme/api</label>
    <p class="gw-progress__value">Counting objects</p>
    <progress class="gw-progress__bar" id="progress-indeterminate-bar" aria-valuetext="Counting objects"></progress>
  </div>
</div>

<div data-example="none-yet" data-title="Nothing done yet">
  <div class="gw-progress">
    <label class="gw-progress__label" for="progress-none-yet-bar">Files uploaded to the workspace</label>
    <p class="gw-progress__value">0 of 48 files uploaded</p>
    <progress class="gw-progress__bar" id="progress-none-yet-bar" value="0" max="48" aria-valuetext="0 of 48 files uploaded"></progress>
  </div>
</div>

<div data-example="complete" data-title="Complete">
  <div class="gw-progress">
    <label class="gw-progress__label" for="progress-complete-bar">Tests in test/session.test.mjs</label>
    <p class="gw-progress__value">14 of 14 tests passed</p>
    <progress class="gw-progress__bar" id="progress-complete-bar" value="14" max="14" aria-valuetext="14 of 14 tests passed"></progress>
  </div>
</div>

<div data-example="long-text" data-title="A long label and a long value">
  <div class="gw-progress">
    <label class="gw-progress__label" for="progress-long-text-bar">Dependencies installed in /srv/workspaces/acme-payments-gateway</label>
    <p class="gw-progress__value">1,204 of 1,460 packages installed, about 40 seconds left</p>
    <progress class="gw-progress__bar" id="progress-long-text-bar" value="1204" max="1460" aria-valuetext="1,204 of 1,460 packages installed, about 40 seconds left"></progress>
  </div>
</div>

<div data-example="several" data-title="Several in a view">
  <div class="gw-stack gw-gap-lg">
    <div class="gw-progress">
      <label class="gw-progress__label" for="progress-several-lint">Lint</label>
      <p class="gw-progress__value">212 of 212 files checked</p>
      <progress class="gw-progress__bar" id="progress-several-lint" value="212" max="212" aria-valuetext="212 of 212 files checked"></progress>
    </div>
    <div class="gw-progress">
      <label class="gw-progress__label" for="progress-several-tests">Tests</label>
      <p class="gw-progress__value">96 of 213 tests run</p>
      <progress class="gw-progress__bar" id="progress-several-tests" value="96" max="213" aria-valuetext="96 of 213 tests run"></progress>
    </div>
  </div>
</div>

<div data-example="inline-width" data-title="A bar sized with an inline style" data-dont="inline-style" data-reason="The apps' content security policies block the style attribute, so the bar would show empty, and a div says nothing to a screen reader. Use a progress element with value and max.">
  <div class="gw-progress">
    <p class="gw-progress__label">Checks on fix/login-timeout</p>
    <p class="gw-progress__value">7 of 12 checks passed</p>
    <div class="gw-progress__bar"><div style="width: 58%"></div></div>
  </div>
</div>

<div data-example="bare-percent" data-title="A bare percentage with no label" data-dont="review" data-reason="58% does not say of what, or how much work is left. Label the bar and write the value as a count with its total and unit.">
  <div class="gw-progress">
    <p class="gw-progress__value">58%</p>
    <progress class="gw-progress__bar" value="58" max="100" aria-label="Progress"></progress>
  </div>
</div>
