<div data-example="default" data-title="Label, value in words and both limits" data-state="default" data-reason="The value is written out with its unit and updates as the thumb moves, so nobody has to judge it from where the thumb sits. The two ends of the track say what the lowest and highest values are.">
  <div class="ds-slider">
    <label class="ds-slider__label" for="slider-default-input">Agents working at once</label>
    <output class="ds-slider__value" for="slider-default-input">4 agents</output>
    <div class="ds-slider__track">
      <input class="ds-slider__input" id="slider-default-input" type="range" name="agents" min="1" max="8" step="1" value="4">
    </div>
    <span class="ds-slider__min">1 agent</span>
    <span class="ds-slider__max">8 agents</span>
  </div>
</div>

<div data-example="named-steps" data-title="Steps that have names">
  <div class="ds-slider">
    <label class="ds-slider__label" for="slider-named-steps-input">Reasoning effort</label>
    <output class="ds-slider__value" for="slider-named-steps-input">High: slower, for hard bugs</output>
    <div class="ds-slider__track">
      <input class="ds-slider__input" id="slider-named-steps-input" type="range" name="effort" min="1" max="4" step="1" value="3" aria-valuetext="High: slower, for hard bugs">
    </div>
    <span class="ds-slider__min">Low</span>
    <span class="ds-slider__max">Maximum</span>
  </div>
</div>

<div data-example="at-minimum" data-title="At the lowest value">
  <div class="ds-slider">
    <label class="ds-slider__label" for="slider-at-minimum-input">Context kept from earlier runs</label>

    <div class="ds-slider__track">
      <input class="ds-slider__input" id="slider-at-minimum-input" type="range" name="context" min="0" max="20" step="5" value="0" aria-valuetext="None">
    </div>
    <span class="ds-slider__min">None</span>
    <span class="ds-slider__max">The last 20 runs</span>
  </div>
</div>

<div data-example="exact-value" data-title="A slider for an exact value, with no value shown" data-dont="review" data-reason="A timeout in seconds has thousands of positions on a track a thumb cannot place that finely, and with no value written out the reader cannot tell 890 from 900. Use a number field for an exact amount, and always write a slider's value in words.">
  <div class="ds-slider">
    <label class="ds-slider__label" for="slider-exact-value-input">Run timeout in seconds</label>
    <div class="ds-slider__track">
      <input class="ds-slider__input" id="slider-exact-value-input" type="range" name="timeout" min="1" max="7200" step="1" value="900">
    </div>
  </div>
</div>
