<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Approvals</title>
    <link rel="stylesheet" href="/design-system.css">
  </head>
  <body>
    <main class="ds-container ds-stack">
      <h1>Approvals</h1>
      <ul class="ds-stack">
        <li>
          <article class="ds-card ds-stack">
            <h2>Run a shell command</h2>
            <p>rm -rf build/</p>
            <div class="ds-cluster">
              <button type="button" class="ds-button">Allow</button>
              <button type="button" class="ds-button">Decline</button>
            </div>
          </article>
        </li>
        <li>
          <article class="ds-card ds-stack">
            <h2>Write a file</h2>
            <p>src/payments/refund.ts</p>
            <div class="ds-cluster">
              <button type="button" class="ds-button">Allow</button>
              <button type="button" class="ds-button">Decline</button>
            </div>
          </article>
        </li>
        <li>
          <article class="ds-card ds-stack">
            <h2>Open a network connection</h2>
            <p>registry.npmjs.org</p>
            <div class="ds-cluster">
              <button type="button" class="ds-button">Allow</button>
              <button type="button" class="ds-button">Decline</button>
            </div>
          </article>
        </li>
      </ul>
    </main>
  </body>
</html>
