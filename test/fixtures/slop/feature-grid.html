<html lang="en">
  <head>

        </div>
        <div class="gw-card gw-stack">
          <svg width="16" height="16" aria-hidden="true"><use href="/icons.svg#gw-icon-check"></use></svg>
          <h3>Secure</h3>
          <p>Protected by default.</p>
        </div>
        <div class="gw-card gw-stack">
          <svg width="16" height="16" aria-hidden="true"><use href="/icons.svg#gw-icon-check"></use></svg>
          <h3>Scalable</h3>
          <p>Grows with you.</p>
        </div>
      </div>
    </main>
  </body>
</html>
