name: CI

# The checks on every pull request and on every push to main. Modelled on jon-lange/botbench's ci.yml, which follows
# jon-lange/settleview's.
# - Build and unit tests: install, the build, the committed dist/ matches it, npm audit, and npm test.
# - WebKit and Firefox: the browser tests of the webkit and firefox Playwright projects (axe, the structural rules,
#   pointer targets, keyboard, theme and reflow tests). They take no screenshots.
# - Secret scan (gitleaks, over the whole history) and CodeQL, on every run.
# The Chrome suite (npm run test:visual) does not run here: its screenshot baselines in test/visual/screenshots/ come
# from the Google Chrome installed on the owner's Mac and that platform's fonts, so a Linux runner would differ from
# every one of them. It runs on the owner's Mac.
# No secret is used by any job. Only pull_request, never pull_request_target: a fork's pull request runs with a
# read-only token and no secrets.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned by full commit hash (the version in the comment): a moved tag cannot change what runs here.

jobs:
  unit:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install (from the lockfile)
        run: npm ci

      - name: Build
        run: npm run build

      - name: The committed dist/ matches the build
        run: git diff --exit-code -- dist

      # The system has no runtime dependencies; this covers the development tools (fails on high or critical).
      - name: npm audit (fails on high or critical)
        run: npm audit --audit-level=high

      - name: Unit tests
        run: npm test

      # The release workflow takes a version's notes from this section, so a pull request that raises the version
      # without one fails here, before main.
      - name: CHANGELOG.md has a section for package.json's version
        run: |
          version=$(jq -r .version package.json)
          grep -qxF "## $version" CHANGELOG.md || { echo "CHANGELOG.md has no \"## $version\" section"; exit 1; }

  engines:
    name: WebKit and Firefox
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install (from the lockfile)
        run: npm ci

      # Playwright's own WebKit and Firefox, at the version in the lockfile, with the system libraries they need.
      - name: Install WebKit and Firefox
        run: npx playwright install --with-deps webkit firefox

      - name: WebKit
        run: npm run test:visual:webkit

      # Runs when WebKit failed too, so one run reports both engines.
      - name: Firefox
        if: success() || failure()
        run: npm run test:visual:firefox

  gitleaks:
    name: Secret scan (gitleaks, whole history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      # From the release's gitleaks_8.30.1_checksums.txt.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # every commit, not only the checked-out tree
          persist-credentials: false

      - name: Install gitleaks (the release binary, checked against its checksum)
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks

      # .gitleaks.toml is read from the checkout. --redact: a finding's value is never printed in the log.
      - name: gitleaks over every commit
        run: /tmp/gitleaks git --redact --no-banner --verbose --config .gitleaks.toml .

  codeql:
    name: CodeQL (JavaScript and TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write  # the upload to code scanning; this job only
      actions: read  # the upload reads this workflow run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # build-mode none: the checker, the behaviour modules, the scripts and react/'s .tsx source are read as they are.
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          languages: javascript-typescript
          build-mode: none

      # Uploaded to code scanning (the repository's Security tab); a failed analysis or upload fails the job.
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          category: javascript-typescript
          output: codeql-results

      - name: What CodeQL found
        run: |
          for f in codeql-results/*.sarif; do
            echo "$f: $(jq '[.runs[].results[]] | length' "$f") results"
            jq -r '.runs[].results[] | "- \(.ruleId): \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)"' "$f"
          done
